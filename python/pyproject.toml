[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "accmv"
version = "0.1.0"
description = "Inference under the available complete-case missing value assumption"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Gang Cheng", email = "mathchenggang@gmail.com"},
  {name = "Yen-Chi Chen"},
  {name = "Maureen A. Smith"},
  {name = "Ying-Qi Zhao"},
]
keywords = ["missing-data", "MNAR", "IPW", "multiply-robust", "statistics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-cov>=4"]
dev = ["ruff>=0.6", "build>=1"]

[project.urls]
Homepage = "https://github.com/mathcg/ACCMV"
Repository = "https://github.com/mathcg/ACCMV.git"
Issues = "https://github.com/mathcg/ACCMV/issues"
Paper = "https://arxiv.org/abs/2207.02289"

[tool.hatch.build.targets.wheel]
packages = ["src/accmv"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
